name: Daily update

on:
  schedule:
    # 06:00 UTC daily = 09:00 Mecca time — lands with the morning coffee.
    # GitHub may delay scheduled runs by a few minutes at busy times; that's fine.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" button in the Actions tab

# Avoid two overlapping runs clobbering each other's commits
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write # needed to push the generated data files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build today's edition
        run: node scripts/update-daily.mjs
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}

      - name: Commit and push data
        run: |
          git config user.name "ai-today-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes today — nothing to commit."
          else
            git commit -m "news: daily edition $(date -u +%F)"
            git push
          fi
